<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4e2a8e"/>
      <stop offset="100%" stop-color="#8a4fd1"/>
    </linearGradient>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>
  <g transform="translate(512 528)" text-anchor="middle" dominant-baseline="middle">
    <text font-family="SF Pro Display, -apple-system, Helvetica, sans-serif"
          font-weight="800" font-size="620" fill="#fff" filter="url(#innerGlow)">C</text>
  </g>
</svg>
