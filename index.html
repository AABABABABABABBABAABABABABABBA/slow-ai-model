<title>ChadGPT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f9f9f9;
    --sidebar_hover: #ececec;
    --user_bubble: #e9e9e980;
    --fg: #0d0d0d;
    --muted: #5d5d5d;
    --faint: #8f8f8f;
    --border: #e3e3e3;
    --surface: #ffffff;
    --surface_raised: #ffffff;
    --accent: #000000;
    --accent_fg: #ffffff;
    --danger: #ef4444;
    --divider: #e3e3e3;
    --sans: ui-sans-serif, -apple-system, "system-ui", "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #212121;
      --sidebar: #181818;
      --sidebar_hover: #2f2f2f;
      --user_bubble: #323232;
      --fg: #ececec;
      --muted: #b4b4b4;
      --faint: #8f8f8f;
      --border: #3e3e3e;
      --surface: #2f2f2f;
      --surface_raised: #353535;
      --accent: #ffffff;
      --accent_fg: #0d0d0d;
      --danger: #ef4444;
      --divider: #3e3e3e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #212121;
    --sidebar: #181818;
    --sidebar_hover: #2f2f2f;
    --user_bubble: #323232;
    --fg: #ececec;
    --muted: #b4b4b4;
    --faint: #8f8f8f;
    --border: #3e3e3e;
    --surface: #2f2f2f;
    --surface_raised: #353535;
    --accent: #ffffff;
    --accent_fg: #0d0d0d;
    --danger: #ef4444;
    --divider: #3e3e3e;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    display: grid;
    grid-template-columns: 260px 1fr;
    min-width: 0;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 50;
  }

  aside {
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(0px, env(safe-area-inset-left, 0px));
  }
  .sb_top {
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .sb_logo {
    width: 32px; height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
  }
  .sb_logo:hover { background: var(--sidebar_hover); }
  .sb_logo svg { width: 22px; height: 22px; color: var(--fg); }
  .sb_icon_btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: transparent;
    border: none;
    color: var(--fg);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .sb_icon_btn:hover { background: var(--sidebar_hover); }
  .sb_icon_btn svg { width: 18px; height: 18px; }

  .sb_item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    margin: 0 8px;
    border-radius: 10px;
    font-size: 14px;
    color: var(--fg);
    cursor: pointer;
    user-select: none;
  }
  .sb_item:hover { background: var(--sidebar_hover); }
  .sb_item svg { width: 18px; height: 18px; color: var(--fg); flex-shrink: 0; }

  .sb_scroll {
    flex: 1;
    overflow-y: auto;
    padding-top: 6px;
  }
  .sb_label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    padding: 10px 18px 4px;
  }
  .sb_chat {
    padding: 7px 12px;
    margin: 1px 8px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    color: var(--fg);
    position: relative;
  }
  .sb_chat .sb_chat_title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .sb_chat.active { background: var(--sidebar_hover); }
  .sb_chat:hover { background: var(--sidebar_hover); }
  .sb_chat_dots {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--muted);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sb_chat:hover .sb_chat_dots,
  .sb_chat.active .sb_chat_dots { display: inline-flex; }
  .sb_chat_dots:hover { background: color-mix(in srgb, var(--fg) 10%, transparent); color: var(--fg); }
  .sb_chat_dots svg { width: 16px; height: 16px; }
  .sb_chat_edit {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
    padding: 2px 6px;
    outline: none;
  }
  .sb_chat_edit:focus { border-color: var(--accent); }

  .sb_bottom {
    padding: 8px;
    border-top: 1px solid var(--border);
  }
  .sb_user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  .sb_user:hover { background: var(--sidebar_hover); }
  .sb_avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #19c37d, #0b7dd1);
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .sb_user_name { font-size: 14px; font-weight: 500; }
  .sb_user_plan { font-size: 12px; color: var(--muted); }

  .chat {
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    padding-block: 8px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .model_picker {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 8px 10px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    background: transparent;
    border: none;
    color: var(--fg);
    font-family: inherit;
  }
  .model_picker:hover { background: var(--sidebar_hover); }
  .model_picker .sub {
    color: var(--muted);
    font-weight: 500;
    margin-left: 4px;
  }
  .model_picker .chev {
    color: var(--muted);
    font-size: 11px;
    margin-left: 4px;
  }
  .header_right { display: inline-flex; align-items: center; gap: 4px; }
  .pill_btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .pill_btn:hover { background: var(--sidebar_hover); }
  .pill_btn svg { width: 14px; height: 14px; }
  .icon_btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: transparent;
    color: var(--fg);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon_btn:hover { background: var(--sidebar_hover); }
  .icon_btn svg { width: 20px; height: 20px; }
  .hamburger { display: none; }

  main {
    flex: 1;
    overflow-y: auto;
    min-width: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .inner {
    max-width: 768px;
    margin: 0 auto;
    padding-block: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    min-width: 0;
  }

  .welcome {
    text-align: center;
    padding: min(14vh, 100px) 0 20px;
  }
  .welcome h1 {
    font-size: 30px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 28px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .chip:hover { background: var(--sidebar_hover); }
  .chip svg { width: 16px; height: 16px; }
  .chip.c1 svg { color: #e8a63d; }
  .chip.c2 svg { color: #9b6bd8; }
  .chip.c3 svg { color: #2e7bd6; }
  .chip.c4 svg { color: #e85b7b; }
  .chip.c5 svg { color: #4a9f6a; }

  .msg_row {
    display: flex;
    gap: 16px;
    min-width: 0;
  }
  .msg_row.user { justify-content: flex-end; }
  .msg_row.user .bubble {
    background: var(--user_bubble);
    padding: 10px 18px;
    border-radius: 24px;
    max-width: 85%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg_row.bot .bot_body {
    flex: 1;
    min-width: 0;
    white-space: pre-wrap;
    word-wrap: break-word;
    padding-top: 2px;
  }

  .thinking {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 15px;
  }
  .thinking_dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--fg);
    animation: thinkpulse 1.4s ease-in-out infinite;
  }
  @keyframes thinkpulse {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }
  .thinking_text { font-style: italic; }

  .typing_cursor {
    display: inline-block;
    width: 14px;
    height: 14px;
    background: var(--fg);
    border-radius: 50%;
    vertical-align: middle;
    margin-left: 2px;
    animation: cursor_pulse 1.1s ease-in-out infinite;
  }
  @keyframes cursor_pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .msg_actions {
    display: flex;
    gap: 2px;
    margin-top: 8px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .msg_row.bot:hover .msg_actions,
  .msg_actions.show { opacity: 1; }
  .action_btn {
    width: 30px; height: 30px;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .action_btn:hover { background: var(--sidebar_hover); color: var(--fg); }
  .action_btn.active { color: var(--accent); }
  .action_btn svg { width: 16px; height: 16px; }

  .mem_notice {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--muted);
    max-width: 400px;
    align-self: flex-start;
  }
  .mem_notice svg { width: 16px; height: 16px; }

  .toast_wrap {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(130px + env(safe-area-inset-bottom, 0px));
    z-index: 40;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: calc(100% - 32px);
    max-width: 420px;
    pointer-events: none;
  }
  .toast {
    background: var(--danger);
    color: #ffffff;
    border-radius: 10px;
    padding: 12px 14px 12px 16px;
    font-size: 14px;
    line-height: 1.4;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    opacity: 0;
    transform: translateY(10px);
    animation: toast_in 0.25s ease-out forwards;
    pointer-events: auto;
  }
  .toast.info { background: var(--surface_raised); color: var(--fg); border: 1px solid var(--border); }
  .toast.out { animation: toast_out 0.25s ease-in forwards; }
  @keyframes toast_in { to { opacity: 1; transform: translateY(0); } }
  @keyframes toast_out { to { opacity: 0; transform: translateY(10px); } }
  .toast svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

  footer {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 4px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .composer_wrap {
    max-width: 768px;
    margin: 0 auto;
  }
  .composer {
    background: var(--user_bubble);
    border-radius: 28px;
    padding: 10px 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .composer textarea {
    background: transparent;
    color: var(--fg);
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    padding: 6px 10px 2px;
    max-height: 180px;
    width: 100%;
    min-width: 0;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .composer_actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 2px 0;
    flex-wrap: wrap;
    gap: 4px;
  }
  .composer_left, .composer_right {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .ca_btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: transparent;
    color: var(--fg);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .ca_btn:hover { background: rgba(127,127,127,0.15); }
  .ca_btn svg { width: 20px; height: 20px; }
  .ca_pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: transparent;
    color: var(--fg);
    border: 1px solid transparent;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .ca_pill:hover { background: rgba(127,127,127,0.15); }
  .ca_pill svg { width: 15px; height: 15px; }

  .send_btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent_fg);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .send_btn:disabled {
    background: color-mix(in srgb, var(--muted) 50%, transparent);
    color: var(--bg);
    cursor: not-allowed;
  }
  .send_btn svg { width: 18px; height: 18px; }

  .footnote {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
    padding-inline: 10px;
  }

  /* popover menus */
  .popover {
    position: fixed;
    background: var(--surface_raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 32px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
    padding: 6px;
    z-index: 70;
    min-width: 220px;
    max-width: 320px;
  }
  .pop_item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--fg);
    cursor: pointer;
    user-select: none;
    width: 100%;
    background: transparent;
    border: none;
    font-family: inherit;
    text-align: left;
  }
  .pop_item:hover { background: var(--sidebar_hover); }
  .pop_item .pi_icon {
    width: 18px; height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .pop_item .pi_icon svg { width: 18px; height: 18px; }
  .pop_item .pi_main {
    flex: 1;
    min-width: 0;
  }
  .pop_item .pi_title { font-size: 14px; font-weight: 500; }
  .pop_item .pi_sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .pop_item .pi_check {
    width: 18px; height: 18px;
    color: var(--fg);
    flex-shrink: 0;
    opacity: 0;
  }
  .pop_item.selected .pi_check { opacity: 1; }
  .pop_item.danger { color: var(--danger); }
  .pop_divider {
    height: 1px;
    background: var(--divider);
    margin: 6px 2px;
  }
  .pop_label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    padding: 8px 10px 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* modal */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 80;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .scrim.show {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 680px;
    max-height: calc(100vh - 80px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(8px);
    transition: transform 0.2s;
  }
  .scrim.show .modal { transform: translateY(0); }
  .modal_head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--divider);
  }
  .modal_head h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .modal_close {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .modal_close:hover { background: var(--sidebar_hover); }
  .modal_close svg { width: 18px; height: 18px; }
  .modal_body {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  .modal_body.single { display: block; padding: 20px; overflow-y: auto; }
  .modal_tabs {
    width: 200px;
    padding: 8px;
    border-right: 1px solid var(--divider);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .modal_tab {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--fg);
    cursor: pointer;
    user-select: none;
  }
  .modal_tab:hover { background: var(--sidebar_hover); }
  .modal_tab.active { background: var(--sidebar_hover); }
  .modal_tab svg { width: 16px; height: 16px; }
  .modal_pane {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    min-width: 0;
  }
  .setting_row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--divider);
  }
  .setting_row:last-child { border-bottom: none; }
  .setting_label { font-size: 14px; font-weight: 500; }
  .setting_sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .setting_ctrl select {
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 28px 6px 10px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .toggle {
    width: 40px;
    height: 22px;
    border-radius: 999px;
    background: var(--border);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    border: none;
    padding: 0;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.15s;
  }
  .toggle.on { background: #19c37d; }
  .toggle.on::after { transform: translateX(18px); }

  .kb_row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--divider);
    font-size: 14px;
  }
  .kb_row:last-child { border-bottom: none; }
  .kb_keys { display: inline-flex; gap: 4px; }
  .kb_key {

<script>
  // state
  const state = {
    model: 'gpt4o',
    theme: 'system',
    chats: [
      { id: 'c1', title: 'Why is this so slow', group: 'Today' },
      { id: 'c2', title: 'Rewrite my resume as pirate', group: 'Today' },
      { id: 'c3', title: 'Fix my scheduling conflict', group: 'Yesterday' },
      { id: 'c4', title: 'Spaghetti carbonara recipe', group: 'Yesterday' },
      { id: 'c5', title: 'Explain CAP theorem simply', group: 'Yesterday' },
      { id: 'c6', title: 'Draft cold email to recruiter', group: 'Previous 7 days' },
      { id: 'c7', title: 'Compare react vs svelte', group: 'Previous 7 days' },
      { id: 'c8', title: 'Why does my dog stare at me', group: 'Previous 7 days' },
      { id: 'c9', title: 'Short story about a sad lamp', group: 'Previous 7 days' },
      { id: 'c10', title: 'Should I buy a used thinkpad', group: 'Previous 7 days' },
      { id: 'c11', title: 'Birthday ideas for best friend', group: 'Previous 30 days' },
      { id: 'c12', title: 'What is reed-solomon encoding', group: 'Previous 30 days' },
      { id: 'c13', title: 'Rhyming couplet about taxes', group: 'Previous 30 days' },
    ],
    activeChat: null,
    settings: {
      followUp: true,
      codeOnDataAnalyst: true,
      archivedChats: false,
      memory: true,
      shareImprove: true,
    },
  };

  const models = [
    { id: 'gpt4o', name: 'ChadGPT', sub: '4o', title: 'ChadGPT 4o', desc: 'Great for most tasks' },
    { id: 'gpt4', name: 'ChadGPT', sub: '4', title: 'ChadGPT 4', desc: 'Reasoning and complex tasks' },
    { id: 'gpt4omini', name: 'ChadGPT', sub: '4o mini', title: 'ChadGPT 4o mini', desc: 'Fastest for everyday tasks' },
    { id: 'o1', name: 'ChadGPT', sub: 'o1', title: 'ChadGPT o1', desc: 'Thinks before responding' },
    { id: 'o1mini', name: 'ChadGPT', sub: 'o1 mini', title: 'ChadGPT o1 mini', desc: 'Faster thinking at some cost' },
    { id: 'temp', name: 'Temporary chat', sub: '', title: 'Temporary chat', desc: 'Not saved to history' },
  ];

  // elements
  const chatList = document.getElementById('chat_list');
  const inner = document.getElementById('inner');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const welcome = document.getElementById('welcome');
  const toastWrap = document.getElementById('toasts');
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const hamburger = document.getElementById('hamburger');
  const mainEl = document.getElementById('main');
  const modelBtn = document.getElementById('model_btn');
  const modelNameEl = document.getElementById('model_name');
  const modelSubEl = document.getElementById('model_sub');
  const profileBtn = document.getElementById('profile_btn');
  const moreBtn = document.getElementById('more_btn');
  const shareBtn = document.getElementById('share_btn');
  const attachBtn = document.getElementById('attach_btn');
  const toolsBtn = document.getElementById('tools_btn');
  const newChatBtn = document.getElementById('new_chat');

  // history
  const history = [];
  let busy = false;
  let claudeSample = null;

  (async () => {
    const s = await window.claude?.use?.('sample');
    claudeSample = s;
  })();

  // theme
  function applyTheme() {
    const t = state.theme;
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('chadgpt_theme', t); } catch(e){}
  }
  try {
    const saved = localStorage.getItem('chadgpt_theme');
    if (saved) state.theme = saved;
  } catch(e){}
  applyTheme();

  // sidebar
  function renderChatList() {
    const groups = {};
    state.chats.forEach(c => {
      if (!groups[c.group]) groups[c.group] = [];
      groups[c.group].push(c);
    });
    chatList.innerHTML = '';
    Object.entries(groups).forEach(([g, chats]) => {
      const label = document.createElement('div');
      label.className = 'sb_label';
      label.textContent = g;
      chatList.appendChild(label);
      chats.forEach(c => {
        const el = document.createElement('div');
        el.className = 'sb_chat' + (c.id === state.activeChat ? ' active' : '');
        el.innerHTML = `
          <span class="sb_chat_title"></span>
          <button class="sb_chat_dots" aria-label="chat options">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
          </button>
        `;
        el.querySelector('.sb_chat_title').textContent = c.title;
        el.querySelector('.sb_chat_title').addEventListener('click', () => {
          state.activeChat = c.id;
          renderChatList();
          loadFakeChat(c);
          closeSidebar();
        });
        el.querySelector('.sb_chat_dots').addEventListener('click', (e) => {
          e.stopPropagation();
          openChatMenu(e.currentTarget, c);
        });
        chatList.appendChild(el);
      });
    });
  }
  renderChatList();

  function loadFakeChat(chat) {
    // just reset to a fake "loaded" state, no real history replay
    inner.innerHTML = '';
    history.length = 0;
    const row = document.createElement('div');
    row.className = 'msg_row user';
    row.innerHTML = '<div class="bubble"></div>';
    row.querySelector('.bubble').textContent = chat.title;
    inner.appendChild(row);
    const bot = document.createElement('div');
    bot.className = 'msg_row bot';
    bot.innerHTML = '<div class="bot_body">This chat has been archived to a slower tier of storage. Loading it would take approximately four days. Try asking a new question instead.</div>';
    inner.appendChild(bot);
  }

  // sidebar actions
  document.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', () => {
      const act = el.getAttribute('data-act');
      if (act === 'new_chat') newChat();
      if (act === 'search') openSearch();
      if (act === 'library') toast({ title: 'Library is empty. Our content moderation team is on it.' }, 3000, 'info');
      if (act === 'gpts') toast({ title: 'Explore GPTs: coming eventually.' }, 3000, 'info');
    });
  });
  newChatBtn.addEventListener('click', newChat);

  function newChat() {
    state.activeChat = null;
    renderChatList();
    history.length = 0;
    inner.innerHTML = '';
    // restore welcome
    inner.appendChild(welcome);
    welcome.hidden = false;
    closeSidebar();
    input.focus();
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    scrim.classList.remove('show');
  }
  hamburger.addEventListener('click', () => {
    sidebar.classList.add('open');
    scrim.classList.add('show');
  });
  scrim.addEventListener('click', closeSidebar);

  // popover system
  let activePopover = null;
  function closePopover() {
    if (activePopover) {
      activePopover.remove();
      activePopover = null;
      document.removeEventListener('click', outsideClick, true);
    }
  }
  function outsideClick(e) {
    if (activePopover && !activePopover.contains(e.target)) closePopover();
  }
  function openPopover(anchor, items, opts = {}) {
    closePopover();
    const pop = document.createElement('div');
    pop.className = 'popover';
    items.forEach(item => {
      if (item === '-') {
        const d = document.createElement('div');
        d.className = 'pop_divider';
        pop.appendChild(d);
      } else if (item.label) {
        const l = document.createElement('div');
        l.className = 'pop_label';
        l.textContent = item.label;
        pop.appendChild(l);
      } else {
        const b = document.createElement('button');
        b.className = 'pop_item';
        if (item.selected) b.classList.add('selected');
        if (item.danger) b.classList.add('danger');
        b.innerHTML = `
          <span class="pi_icon">${item.icon || ''}</span>
          <span class="pi_main">
            <div class="pi_title"></div>
            ${item.sub ? '<div class="pi_sub"></div>' : ''}
          </span>
          <svg class="pi_check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        `;
        b.querySelector('.pi_title').textContent = item.title;
        if (item.sub) b.querySelector('.pi_sub').textContent = item.sub;
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          closePopover();
          item.onClick?.();
        });
        pop.appendChild(b);
      }
    });
    document.body.appendChild(pop);
    const rect = anchor.getBoundingClientRect();
    const w = pop.offsetWidth;
    const h = pop.offsetHeight;
    let x = rect.left;
    let y = rect.bottom + 6;
    if (opts.align === 'right') x = rect.right - w;
    if (opts.align === 'above') y = rect.top - h - 6;
    x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
    y = Math.max(8, Math.min(y, window.innerHeight - h - 8));
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    activePopover = pop;
    setTimeout(() => document.addEventListener('click', outsideClick, true), 0);
  }

  // model picker
  modelBtn.addEventListener('click', () => {
    openPopover(modelBtn, [
      { label: 'Models' },
      ...models.filter(m => m.id !== 'temp').map(m => ({
        title: m.title,
        sub: m.desc,
        selected: state.model === m.id,
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 20 7v10l-8 4.5L4 17V7l8-4.5Z"/></svg>',
        onClick: () => setModel(m.id),
      })),
      '-',
      {
        title: 'Temporary chat',
        sub: 'Not saved to history',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
        onClick: () => setModel('temp'),
      },
    ]);
  });
  function setModel(id) {
    state.model = id;
    const m = models.find(x => x.id === id);
    modelNameEl.textContent = m.name;
    modelSubEl.textContent = m.sub;
    const notice = id === 'temp'
      ? 'Temporary chat enabled. Nothing will be saved. Not that it would matter.'
      : `Switched to ${m.title}. Response times unchanged.`;
    toast({ title: notice }, 3000, 'info');
  }

  // profile menu
  profileBtn.addEventListener('click', (e) => {

  function renameChat(chat) {
    renderChatList();
    const el = Array.from(chatList.querySelectorAll('.sb_chat')).find(e => e.querySelector('.sb_chat_title')?.textContent === chat.title);

    const titleEl = el.querySelector('.sb_chat_title');
    const dotsEl = el.querySelector('.sb_chat_dots');
    const edit = document.createElement('input');
    edit.className = 'sb_chat_edit';
    edit.value = chat.title;
    titleEl.replaceWith(edit);
    if (dotsEl) dotsEl.style.display = 'none';
    edit.focus();
    edit.select();
    const commit = () => {
      const v = edit.value.trim();
      if (v) chat.title = v;
      renderChatList();
    };
    edit.addEventListener('blur', commit);
    edit.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { renderChatList(); }
    });
  }

  function openModal(opts) {
    modalRoot.innerHTML = '';
    const scrimEl = document.createElement('div');
    scrimEl.className = 'scrim';
    const modal = document.createElement('div');
    modal.className = 'modal';
    scrimEl.appendChild(modal);
    const head = document.createElement('div');
    head.className = 'modal_head';
    head.innerHTML = `<h3></h3><button class="modal_close" aria-label="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg></button>`;
    head.querySelector('h3').textContent = opts.title;
    head.querySelector('.modal_close').addEventListener('click', closeModal);
    modal.appendChild(head);
    const body = document.createElement('div');
    body.className = opts.tabs ? 'modal_body' : 'modal_body single';
    modal.appendChild(body);
    if (opts.tabs) {
      const tabCol = document.createElement('div');
      tabCol.className = 'modal_tabs';
      const pane = document.createElement('div');
      pane.className = 'modal_pane';
      body.appendChild(tabCol);
      body.appendChild(pane);
      opts.tabs.forEach((t, i) => {
        const tabEl = document.createElement('div');
        tabEl.className = 'modal_tab' + (i === 0 ? ' active' : '');
        tabEl.innerHTML = `${t.icon}<span></span>`;
        tabEl.querySelector('span').textContent = t.name;
        tabEl.addEventListener('click', () => {
          tabCol.querySelectorAll('.modal_tab').forEach(x => x.classList.remove('active'));
          tabEl.classList.add('active');
          pane.innerHTML = '';
          t.render(pane);
        });
        tabCol.appendChild(tabEl);
      });
      opts.tabs[0].render(pane);
    } else {
      opts.render(body);
    }
    scrimEl.addEventListener('click', (e) => {
      if (e.target === scrimEl) closeModal();
    });
    modalRoot.appendChild(scrimEl);
    requestAnimationFrame(() => scrimEl.classList.add('show'));
  }

          }
        },
        {
          name: 'Account', icon: accountIcon,
          render: (p) => {
            p.innerHTML = `
              <div class="setting_row">
                <div><div class="setting_label">Email</div><div class="setting_sub">corby@example.com</div></div>
              </div>
              <div class="setting_row">
                <div><div class="setting_label">Plan</div><div class="setting_sub">Free. ChadGPT Plus is $20/month and ships with the same slowness.</div></div>
                <button class="btn_primary">Upgrade</button>
              </div>
              <div class="setting_row">
                <div><div class="setting_label">Multi-factor authentication</div><div class="setting_sub">Secure your account with 2FA.</div></div>
                <button class="btn_primary">Enable</button>
              </div>
              <div class="setting_row">
                <div><div class="setting_label">Log out of this device</div></div>
                <button class="btn_primary">Log out</button>
              </div>
            `;
          }
        },
      ],
    });
  }

  function openCustomize() {
    openModal({
      title: 'Customize ChadGPT',
      render: (p) => {
        p.innerHTML = `
          <div style="font-size:13px;color:var(--muted);margin-bottom:12px">What would you like ChadGPT to know about you to provide better responses?</div>
          <textarea style="width:100%;min-height:120px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-family:inherit;font-size:14px;resize:vertical" placeholder="For example, your profession, interests, where you live..."></textarea>
          <div style="font-size:13px;color:var(--muted);margin:20px 0 8px">How would you like ChadGPT to respond?</div>
          <textarea style="width:100%;min-height:120px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-family:inherit;font-size:14px;resize:vertical" placeholder="For example, tone, format, length..."></textarea>
          <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
            <button class="btn_primary" style="background:transparent;color:var(--fg);border:1px solid var(--border)" onclick="document.querySelector('.scrim')?.classList.remove('show'); setTimeout(()=>document.querySelector('.modal_root')?.replaceChildren(),200)">Cancel</button>
            <button class="btn_primary" id="save_custom">Save</button>
          </div>
        `;
        p.querySelector('#save_custom').addEventListener('click', () => {
          closeModal();
          toast({ title: 'Instructions saved. They will be ignored at the same rate as before.' }, 3500, 'info');
        });
      },
    });
  }

  function openShare(chat) {
    openModal({
      title: `Share link to chat`,
      render: (p) => {
        const url = `https://chad.gpt/share/${(chat.title || 'chat').toLowerCase().replace(/\s+/g,'-').slice(0,32)}-${Math.random().toString(36).slice(2,8)}`;
        p.innerHTML = `
          <div style="font-size:13px;color:var(--muted)">Your name, custom instructions, and any messages you add after sharing stay private.</div>
          <div class="share_url">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;color:var(--muted)"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.71"/></svg>
            <input readonly value="${url}" />
            <button class="btn_primary" id="copy_url">Copy link</button>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:8px">Anyone with this link can view the conversation. Possibly in several hours.</div>
        `;
        p.querySelector('#copy_url').addEventListener('click', async () => {
          const inp = p.querySelector('input');
          try {
            await navigator.clipboard.writeText(inp.value);
            toast({ title: 'Link copied.' }, 2000, 'info');
          } catch(e) {
            inp.select();
          }
          closeModal();
        });
      },
    });
  }

  function openShortcuts() {
    openModal({
      title: 'Keyboard shortcuts',
      render: (p) => {
        const rows = [
          ['Open new chat', ['Ctrl','Shift','O']],
          ['Toggle sidebar', ['Ctrl','Shift','S']],
          ['Set custom instructions', ['Ctrl','Shift','I']],
          ['Delete chat', ['Ctrl','Shift','⌫']],
          ['Clear chat', ['Ctrl','Shift','X']],
          ['Show shortcuts', ['Ctrl','/']],
          ['Copy last response', ['Ctrl','Shift','C']],
          ['Focus chat input', ['Shift','Esc']],
        ];
        p.innerHTML = rows.map(r => `
          <div class="kb_row">
            <div></div>
            <div class="kb_keys">${r[1].map(k => `<span class="kb_key">${k}</span>`).join('')}</div>
          </div>
        `).join('');
        p.querySelectorAll('.kb_row').forEach((row, i) => {
          row.firstElementChild.textContent = rows[i][0];
        });
      },
    });
  }

  function openSearch() {
    openModal({
      title: 'Search chats',
      render: (p) => {
        p.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:10px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;color:var(--muted)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="search_input" id="s_in" placeholder="Search chats..." autocomplete="off"/>
          </div>
          <div id="s_res" style="margin-top:12px;max-height:400px;overflow-y:auto"></div>
        `;
        const render = (q) => {
          const res = p.querySelector('#s_res');
          const terms = q.trim().toLowerCase();
          const filtered = state.chats.filter(c => c.title.toLowerCase().includes(terms));
          res.innerHTML = filtered.length ? filtered.map(c => `
            <div class="search_row" data-id="${c.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span></span>
            </div>
          `).join('') : '<div style="color:var(--muted);padding:12px;text-align:center">No chats found.</div>';
          res.querySelectorAll('.search_row').forEach(row => {
            const id = row.getAttribute('data-id');
            const chat = state.chats.find(c => c.id === id);
            row.querySelector('span').textContent = chat.title;
            row.addEventListener('click', () => {
              closeModal();
              state.activeChat = id;
              renderChatList();
              loadFakeChat(chat);
            });
          });
        };
        render('');
        const inp = p.querySelector('#s_in');
        inp.addEventListener('input', (e) => render(e.target.value));
        setTimeout(() => inp.focus(), 50);
      },
    });
  }

  function openUpgrade() {
    openModal({
      title: 'Upgrade your plan',
      render: (p) => {
        p.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr;gap:12px">
            <div style="border:1px solid var(--border);border-radius:12px;padding:16px">
              <div style="font-size:16px;font-weight:600">Free</div>
              <div style="color:var(--muted);font-size:13px;margin-top:4px">$0/month</div>
              <ul style="font-size:14px;line-height:1.7;padding-left:18px;margin:12px 0 0">
                <li>Unlimited time to think about your prompt</li>
                <li>Access to ChadGPT 4o when the servers aren't crying</li>
                <li>Error toasts included at no extra charge</li>
              </ul>
            </div>
            <div style="border:2px solid var(--accent);border-radius:12px;padding:16px">
              <div style="font-size:16px;font-weight:600">Plus</div>
              <div style="color:var(--muted);font-size:13px;margin-top:4px">$20/month</div>
              <ul style="font-size:14px;line-height:1.7;padding-left:18px;margin:12px 0 12px">
                <li>Same model, same wait times, just more guilt</li>
                <li>Priority access to our apology emails</li>
                <li>Exclusive early access to new technical difficulties</li>
              </ul>
              <button class="btn_primary" style="width:100%" id="upg_btn">Upgrade to Plus</button>
            </div>
          </div>
        `;
        p.querySelector('#upg_btn').addEventListener('click', () => {
          closeModal();
          toast({ title: 'Payment failed. Try again in approximately one business century.' }, 4000);
        });
      },
    });
  }

  // input and submit
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    sendBtn.disabled = !input.value.trim() || busy;
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  sendBtn.addEventListener('click', submit);

  document.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.getAttribute('data-seed');
      input.value = text;
      input.dispatchEvent(new Event('input'));
      submit();
    });
  });

  function submit() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    if (welcome.parentNode) welcome.remove();
    runTurn(text);
  }

  function addUserMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg_row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    inner.appendChild(row);
    scrollDown();
  }

  function addBotRow() {
    const row = document.createElement('div');
    row.className = 'msg_row bot';
    row.innerHTML = `<div class="bot_body"></div>`;
    inner.appendChild(row);
    scrollDown();
    return row;
  }

  const toastContent = [
    { title: 'Hmm... something seems to have gone wrong.' },
    { title: 'You\'ve reached our usage limit. Try again later.' },
    { title: 'Rate limit exceeded' },
    { title: 'Network error. Please try again.' },
    { title: 'Our systems are experiencing high demand.' },
    { title: 'The server had an error while processing your request.' },
    { title: 'Something went wrong. Please try again.' },
  ];

  function toast(obj, duration = 4500, variant = '') {
    const el = document.createElement('div');
    el.className = 'toast' + (variant ? ' ' + variant : '');
    el.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      <div></div>
    `;
    el.querySelector('div').textContent = obj.title;
    toastWrap.appendChild(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 300);
    }, duration);
  }

  function scrollDown() {
    requestAnimationFrame(() => {
      mainEl.scrollTo({ top: mainEl.scrollHeight, behavior: 'smooth' });
    });
  }

  const statusLines = [
    'Thinking',
    'Searching',
    'Reasoning',
    'Still thinking',
    'This is taking longer than usual',
    'Reconnecting',
    'Loading response',
    'Almost there',
  ];

  async function runTurn(userText) {
    busy = true;
    sendBtn.disabled = true;

    addUserMsg(userText);
    history.push({ role: 'user', content: userText });

    const botRow = addBotRow();
    const botBody = botRow.querySelector('.bot_body');

    botBody.innerHTML = `
      <div class="thinking">
        <span class="thinking_dot"></span>
        <span class="thinking_text">Thinking</span>
      </div>
    `;
    const thinkingText = botBody.querySelector('.thinking_text');

    let aiPromise;
    if (claudeSample) {
      const prompt = history.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));
      aiPromise = claudeSample(prompt, { modelTier: 'quick' }).catch(err => ({ error: err }));
    } else {
      aiPromise = Promise.resolve({ text: "The AI call needs the sample capability granted. The UI works, you just can't talk to a model." });
    }

    const started = Date.now();
    let aiDone = false;
    let aiResult = null;
    aiPromise.then(r => { aiResult = r; aiDone = true; });

    let statusIdx = 1;
    const statusTick = setInterval(() => {
      thinkingText.textContent = statusLines[statusIdx % statusLines.length];
      statusIdx++;
    }, 4200);

    let toastIdx = Math.floor(Math.random() * toastContent.length);
    setTimeout(() => toast(toastContent[toastIdx++ % toastContent.length]), 3000);
    const toastTick = setInterval(() => {
      toast(toastContent[toastIdx++ % toastContent.length]);
    }, 8500);

    const minStallMs = 26000;
    while (Date.now() - started < minStallMs || !aiDone) {
      await sleep(500);
    }

    clearInterval(statusTick);
    clearInterval(toastTick);

    thinkingText.textContent = 'Generating response';
    await sleep(900);

    botBody.innerHTML = '';
    const textNode = document.createElement('span');
    const cursor = document.createElement('span');
    cursor.className = 'typing_cursor';
    botBody.appendChild(textNode);
    botBody.appendChild(cursor);

    const result = aiResult || {};
    let text = '';
    if (result.error) {
      text = "Something went wrong while generating that. You can try again, but no promises.";
    } else {
      text = result.text || "The model responded with silence. Make of that what you will.";
    }

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      textNode.appendChild(document.createTextNode(ch));
      scrollDown();
      let d = 26;
      if (ch === ' ') d = 48;
      if (ch === '.' || ch === '!' || ch === '?') d = 380;
      if (ch === ',' || ch === ';' || ch === ':') d = 170;
      if (ch === '\n') d = 220;
      await sleep(d);
    }
    cursor.remove();

    const actions = document.createElement('div');
    actions.className = 'msg_actions show';
    actions.innerHTML = `
      <button class="action_btn" data-act="copy" aria-label="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      <button class="action_btn" data-act="like" aria-label="like"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H7"/></svg></button>
      <button class="action_btn" data-act="dislike" aria-label="dislike"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H17"/></svg></button>
      <button class="action_btn" data-act="regen" aria-label="regenerate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg></button>
      <button class="action_btn" data-act="speak" aria-label="read aloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
    `;
    botBody.appendChild(actions);

    actions.querySelector('[data-act="copy"]').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(text); toast({ title: 'Copied.' }, 2000, 'info'); } catch (e) {}
    });
    actions.querySelector('[data-act="like"]').addEventListener('click', (e) => {
      e.currentTarget.classList.toggle('active');
    });
    actions.querySelector('[data-act="dislike"]').addEventListener('click', (e) => {
      e.currentTarget.classList.toggle('active');
      toast({ title: 'Noted. We will reply to your complaint shortly.' }, 3000, 'info');
    });
    actions.querySelector('[data-act="regen"]').addEventListener('click', () => {
      toast({ title: 'Regenerate queued. Expected: another 26 seconds.' }, 3000, 'info');
    });
    actions.querySelector('[data-act="speak"]').addEventListener('click', () => {
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.6;
        window.speechSynthesis.speak(u);
      } catch(e) {}
    });

    history.push({ role: 'assistant', content: text });

    busy = false;
    sendBtn.disabled = !input.value.trim();
    input.focus();
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  input.focus();
</script>
