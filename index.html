<title>ChadGPT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.0/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f9f9f9;
    --sidebar_hover: #ececec;
    --user_bubble: #e9e9e980;
    --fg: #0d0d0d;
    --muted: #5d5d5d;
    --faint: #8f8f8f;
    --border: #e3e3e3;
    --surface: #ffffff;
    --surface_raised: #ffffff;
    --accent: #000000;
    --accent_fg: #ffffff;
    --danger: #ef4444;
    --ok: #19c37d;
    --warn: #f0b429;
    --cf_orange: #f6821f;
    --divider: #e3e3e3;
    --code_bg: #f3f3f3;
    --sans: ui-sans-serif, -apple-system, "system-ui", "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #212121;
      --sidebar: #181818;
      --sidebar_hover: #2f2f2f;
      --user_bubble: #323232;
      --fg: #ececec;
      --muted: #b4b4b4;
      --faint: #8f8f8f;
      --border: #3e3e3e;
      --surface: #2f2f2f;
      --surface_raised: #353535;
      --accent: #ffffff;
      --accent_fg: #0d0d0d;
      --code_bg: #1a1a1a;
      --divider: #3e3e3e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #212121;
    --sidebar: #181818;
    --sidebar_hover: #2f2f2f;
    --user_bubble: #323232;
    --fg: #ececec;
    --muted: #b4b4b4;
    --faint: #8f8f8f;
    --border: #3e3e3e;
    --surface: #2f2f2f;
    --surface_raised: #353535;
    --accent: #ffffff;
    --accent_fg: #0d0d0d;
    --code_bg: #1a1a1a;
    --divider: #3e3e3e;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    display: grid;
    grid-template-columns: 260px 1fr;
    min-width: 0;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 50;
  }

  aside {
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(0px, env(safe-area-inset-left, 0px));
  }
  .sb_top {
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .sb_logo {
    width: 32px; height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
  }
  .sb_logo:hover { background: var(--sidebar_hover); }
  .sb_logo svg { width: 22px; height: 22px; color: var(--fg); }
  .sb_icon_btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: transparent;
    border: none;
    color: var(--fg);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .sb_icon_btn:hover { background: var(--sidebar_hover); }
  .sb_icon_btn svg { width: 18px; height: 18px; }

  .sb_item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    margin: 0 8px;
    border-radius: 10px;
    font-size: 14px;
    color: var(--fg);
    cursor: pointer;
    user-select: none;
  }
  .sb_item:hover { background: var(--sidebar_hover); }
  .sb_item svg { width: 18px; height: 18px; color: var(--fg); flex-shrink: 0; }

  .sb_scroll {
    flex: 1;
    overflow-y: auto;
    padding-top: 6px;
  }
  .sb_label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    padding: 10px 18px 4px;
  }
  .sb_chat {
    padding: 7px 12px;
    margin: 1px 8px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    color: var(--fg);
    position: relative;
  }
  .sb_chat .sb_chat_title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .sb_chat.active { background: var(--sidebar_hover); }
  .sb_chat:hover { background: var(--sidebar_hover); }
  .sb_chat_dots {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--muted);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sb_chat:hover .sb_chat_dots,
  .sb_chat.active .sb_chat_dots { display: inline-flex; }
  .sb_chat_dots:hover { background: color-mix(in srgb, var(--fg) 10%, transparent); color: var(--fg); }
  .sb_chat_dots svg { width: 16px; height: 16px; }
  .sb_chat_edit {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
    padding: 2px 6px;
    outline: none;
  }

  .sb_bottom {
    padding: 8px;
    border-top: 1px solid var(--border);
  }
  .sb_user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  .sb_user:hover { background: var(--sidebar_hover); }
  .sb_avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #19c37d, #0b7dd1);
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .sb_user_name { font-size: 14px; font-weight: 500; }
  .sb_user_plan { font-size: 12px; color: var(--muted); }

  .chat {
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    padding-block: 8px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    gap: 8px;
  }
  .hd_left { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
  .model_picker {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 8px 10px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    background: transparent;
    border: none;
    color: var(--fg);
    font-family: inherit;
  }
  .model_picker:hover { background: var(--sidebar_hover); }
  .model_picker .sub {
    color: var(--muted);
    font-weight: 500;
    margin-left: 4px;
  }
  .model_picker .chev { color: var(--muted); font-size: 11px; margin-left: 4px; }

  .edge_badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--cf_orange) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--cf_orange) 40%, transparent);
    color: var(--fg);
    font-size: 12px;
    font-family: var(--mono);
    cursor: default;
    white-space: nowrap;
  }
  .chad_badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--ok) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent);
    color: var(--fg);
    font-size: 12px;
    font-family: var(--mono);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    background-image: none;
  }
  .chad_badge .chad_dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ok);
  }
  .chad_badge.off {
    background: transparent;
    border-color: var(--border);
    color: var(--muted);
  }
  .chad_badge.off .chad_dot { background: var(--muted); }
  .chad_badge.coder {
    background: color-mix(in srgb, #2e7bd6 18%, transparent);
    border-color: color-mix(in srgb, #2e7bd6 55%, transparent);
    color: var(--fg);
  }
  .chad_badge.coder .chad_dot { background: #2e7bd6; }
  .edge_badge.workers {
    background: color-mix(in srgb, var(--cf_orange) 22%, transparent);
    border-color: color-mix(in srgb, var(--cf_orange) 60%, transparent);
  }
  .edge_badge .cf {
    color: var(--cf_orange);
    display: inline-flex;
  }
  .edge_badge .cf svg { width: 14px; height: 14px; }
  .edge_badge .ping { color: var(--ok); font-weight: 600; }
  .edge_badge .pulse {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ok);
    animation: breathe 1.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); }
    50% { opacity: 0.6; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 0%, transparent); }
  }

  .header_right { display: inline-flex; align-items: center; gap: 4px; }
  .pill_btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .pill_btn:hover { background: var(--sidebar_hover); }
  .pill_btn svg { width: 14px; height: 14px; }
  .icon_btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: transparent;
    color: var(--fg);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon_btn:hover { background: var(--sidebar_hover); }
  .icon_btn svg { width: 20px; height: 20px; }
  .hamburger { display: none; }

  main {
    flex: 1;
    overflow-y: auto;
    min-width: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .inner {
    max-width: 768px;
    width: 100%;
    margin: 0 auto;
    padding-block: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    min-width: 0;
    align-items: stretch;
  }
  .welcome h1 { max-width: 100%; overflow-wrap: break-word; }

  .welcome {
    text-align: center;
    padding: min(12vh, 90px) 0 20px;
  }
  .welcome_badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--cf_orange) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--cf_orange) 35%, transparent);
    color: var(--fg);
    font-size: 12px;
    font-family: var(--mono);
    margin-bottom: 16px;
  }
  .welcome_badge .cf { color: var(--cf_orange); display: inline-flex; }
  .welcome_badge .cf svg { width: 14px; height: 14px; }
  .welcome h1 {
    font-size: 30px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .welcome_sub {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 28px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .chip:hover { background: var(--sidebar_hover); }
  .chip svg { width: 16px; height: 16px; }
  .chip.c1 svg { color: #e8a63d; }
  .chip.c2 svg { color: #9b6bd8; }
  .chip.c3 svg { color: #2e7bd6; }
  .chip.c4 svg { color: #e85b7b; }
  .chip.c5 svg { color: #4a9f6a; }

  .msg_row {
    display: flex;
    gap: 16px;
    min-width: 0;
    width: 100%;
    position: relative;
  }
  .msg_row.user { justify-content: flex-end; }
  .msg_row.user .bubble {
    background: var(--user_bubble);
    padding: 10px 18px;
    border-radius: 24px;
    max-width: 85%;
    white-space: pre-wrap;
    word-wrap: break-word;
    position: relative;
  }
  .msg_row.user .user_edit {
    position: absolute;
    left: -36px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 0.15s;
    width: 28px; height: 28px;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .msg_row.user:hover .user_edit { opacity: 1; }
  .user_edit svg { width: 14px; height: 14px; }
  .user_edit:hover { background: var(--sidebar_hover); color: var(--fg); }

  .msg_row.bot .bot_body {
    flex: 1 1 0;
    min-width: 0;
    max-width: 100%;
    width: 100%;
    word-wrap: break-word;
    padding-top: 2px;
    overflow-wrap: break-word;
  }
  .bot_body p { margin: 0 0 12px; }
  .bot_body p:last-child { margin-bottom: 0; }
  .bot_body h1, .bot_body h2, .bot_body h3 {
    margin: 16px 0 8px;
    font-weight: 600;
    line-height: 1.3;
  }
  .bot_body h1 { font-size: 22px; }
  .bot_body h2 { font-size: 19px; }
  .bot_body h3 { font-size: 16px; }
  .bot_body ul, .bot_body ol { margin: 0 0 12px; padding-left: 24px; }
  .bot_body li { margin-bottom: 4px; }
  .bot_body code {
    background: var(--code_bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.9em;
  }
  .bot_body pre {
    background: var(--code_bg);
    padding: 12px 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 0 0 12px;
    border: 1px solid var(--border);
  }
  .bot_body pre code {
    background: transparent;
    padding: 0;
    font-size: 13px;
    line-height: 1.5;
  }
  .bot_body a { color: #2e7bd6; text-decoration: underline; }
  .bot_body blockquote {
    border-left: 3px solid var(--border);
    margin: 0 0 12px;
    padding: 2px 12px;
    color: var(--muted);
  }
  .bot_body table {
    border-collapse: collapse;
    margin: 0 0 12px;
    font-size: 14px;
  }
  .bot_body th, .bot_body td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .bot_body th { background: var(--sidebar); font-weight: 600; }

  .stream_cursor {
    display: inline-block;
    width: 10px;
    height: 16px;
    background: var(--fg);
    border-radius: 2px;
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: cursor_fast 0.5s ease-in-out infinite;
  }
  @keyframes cursor_fast {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .stream_meta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    padding-top: 6px;
  }
  .stream_meta .tok { color: var(--ok); font-weight: 600; }

  .msg_actions {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-top: 8px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .msg_row.bot:hover .msg_actions,
  .msg_actions.show { opacity: 1; }
  .action_btn {
    width: 30px; height: 30px;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .action_btn:hover { background: var(--sidebar_hover); color: var(--fg); }
  .action_btn.active { color: var(--accent); }
  .action_btn svg { width: 16px; height: 16px; }
  .action_stat {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    padding-left: 6px;
    border-left: 1px solid var(--border);
    margin-left: 4px;
  }

  .toast_wrap {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(130px + env(safe-area-inset-bottom, 0px));
    z-index: 40;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: calc(100% - 32px);
    max-width: 420px;
    pointer-events: none;
  }
  .toast {
    background: var(--surface_raised);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px 12px 16px;
    font-size: 14px;
    line-height: 1.4;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    opacity: 0;
    transform: translateY(10px);
    animation: toast_in 0.25s ease-out forwards;
    pointer-events: auto;
  }
  .toast.ok { border-color: var(--ok); }
  .toast.ok svg { color: var(--ok); }
  .toast.err { border-color: var(--danger); }
  .toast.err svg { color: var(--danger); }
  .toast.out { animation: toast_out 0.25s ease-in forwards; }
  @keyframes toast_in { to { opacity: 1; transform: translateY(0); } }
  @keyframes toast_out { to { opacity: 0; transform: translateY(10px); } }
  .toast svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

  footer {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 4px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .composer_wrap { max-width: 768px; margin: 0 auto; position: relative; }
  .composer {
    background: var(--user_bubble);
    border-radius: 28px;
    padding: 10px 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .composer textarea {
    background: transparent;
    color: var(--fg);
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    padding: 6px 10px 2px;
    max-height: 180px;
    width: 100%;
    min-width: 0;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .composer_actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 2px 0;
    flex-wrap: wrap;
    gap: 4px;
  }
  .composer_left, .composer_right {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .ca_btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: transparent;
    color: var(--fg);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .ca_btn:hover { background: rgba(127,127,127,0.15); }
  .ca_btn svg { width: 20px; height: 20px; }
  .ca_pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: transparent;
    color: var(--fg);
    border: 1px solid transparent;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .ca_pill:hover { background: rgba(127,127,127,0.15); }
  .ca_pill svg { width: 15px; height: 15px; }

  .send_btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent_fg);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .send_btn:disabled {
    background: color-mix(in srgb, var(--muted) 50%, transparent);
    color: var(--bg);
    cursor: not-allowed;
  }
  .send_btn.stop { background: var(--fg); }
  .send_btn svg { width: 18px; height: 18px; }

  .footnote {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
    padding-inline: 10px;
    display: inline-flex;
    gap: 6px;
    width: 100%;

  function renameChat(chat) {

    const titleEl = el.querySelector('.sb_chat_title');
    const dotsEl = el.querySelector('.sb_chat_dots');
    const edit = document.createElement('input');
    edit.className = 'sb_chat_edit';
    edit.value = chat.title;
    titleEl.replaceWith(edit);
    if (dotsEl) dotsEl.style.display = 'none';
    edit.focus();
    edit.select();
    const commit = () => {
      const v = edit.value.trim();
      if (v) chat.title = v;
      saveState();
      renderChatList();
    };
    edit.addEventListener('blur', commit);
    edit.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { renderChatList(); }
    });

  function exportChatMd(chat) {
    const title = `# ${chat.title}\n\n_Exported from ChadGPT · ${new Date().toISOString().slice(0,10)}_\n\n`;
    const body = (chat.messages || []).map(m => {
      const who = m.role === 'user' ? '**You**' : '**ChadGPT**';
      return `${who}:\n\n${m.content}\n`;
    }).join('\n---\n\n');
    downloadFile(chat.title.replace(/[^\w]+/g, '_') + '.md', title + body);

  async function downloadFile(filename, data) {
    const downloads = await window.claude?.use?.('downloads');
    if (downloads?.save) {
      try {
        await downloads.save({ filename, data });
        toast({ title: 'Download ready.' }, 2500, 'ok');
        return;
      } catch (e) {
        toast({ title: 'Download declined.' }, 2500);
        return;
      }
    }
    // fallback: open in new window with content
    const w = window.open();
    if (w) {
      w.document.write('<pre style="white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace">' + escapeHtml(data) + '</pre>');
      w.document.title = filename;
    }
  }

    const r = new Rec();
    r.lang = 'en-US';
    r.interimResults = true;
    let finalText = '';
    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      input.value = (finalText + interim).trim();
      input.dispatchEvent(new Event('input'));
    };
    r.onend = () => {
      toast({ title: 'Voice input stopped.' }, 1800);
    };
    r.start();

    modal.className = 'modal';
    scrimEl.appendChild(modal);

    head.className = 'modal_head';
    head.innerHTML = `<h3></h3><button class="modal_close" aria-label="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg></button>`;
    head.querySelector('h3').textContent = opts.title;
    head.querySelector('.modal_close').addEventListener('click', closeModal);
    modal.appendChild(head);
    const body = document.createElement('div');
    body.className = opts.tabs ? 'modal_body' : 'modal_body single';
    modal.appendChild(body);
    if (opts.tabs) {
      const tabCol = document.createElement('div');
      tabCol.className = 'modal_tabs';
      const pane = document.createElement('div');
      pane.className = 'modal_pane';
      body.appendChild(tabCol);
      body.appendChild(pane);
      opts.tabs.forEach((t, i) => {
        const tabEl = document.createElement('div');
        tabEl.className = 'modal_tab' + (i === 0 ? ' active' : '');
        tabEl.innerHTML = `${t.icon}<span></span>`;
        tabEl.querySelector('span').textContent = t.name;
        tabEl.addEventListener('click', () => {
          tabCol.querySelectorAll('.modal_tab').forEach(x => x.classList.remove('active'));
          tabEl.classList.add('active');
          pane.innerHTML = '';
          t.render(pane);
        });
        tabCol.appendChild(tabEl);
      });
      opts.tabs[0].render(pane);
    } else {
      opts.render(body);
    }
    scrimEl.addEventListener('click', (e) => {
      if (e.target === scrimEl) closeModal();
    });
    modalRoot.appendChild(scrimEl);
    requestAnimationFrame(() => scrimEl.classList.add('show'));

  // slash command menu
  let slashHover = 0;
  function showSlashMenu(filter) {
    hideSlashMenu();
    const items = slashCommands.filter(c => c.cmd.toLowerCase().includes(filter.toLowerCase()) || c.title.toLowerCase().includes(filter.toLowerCase()));
    if (!items.length) return;
    slashHover = Math.min(slashHover, items.length - 1);
    const menu = document.createElement('div');
    menu.className = 'slash_menu';
    menu.id = 'slash_menu';
    items.forEach((it, i) => {
      const btn = document.createElement('button');
      btn.className = 'pop_item' + (i === slashHover ? ' hover' : '');
      btn.innerHTML = `
        <span class="pi_icon">${slashIcons[it.icon] || ''}</span>
        <span class="pi_main">
          <div class="pi_title"></div>
          <div class="pi_sub"></div>
        </span>
        <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">${it.cmd}</span>
      `;
      btn.querySelector('.pi_title').textContent = it.title;
      btn.querySelector('.pi_sub').textContent = it.desc;
      btn.addEventListener('mouseenter', () => { slashHover = i; refreshSlashHover(); });
      btn.addEventListener('mousedown', (e) => { e.preventDefault(); applySlash(it); });
      menu.appendChild(btn);
    });
    composerWrap.appendChild(menu);
    menu._items = items;
  }
  function refreshSlashHover() {
    const menu = document.getElementById('slash_menu');
    if (!menu) return;
    menu.querySelectorAll('.pop_item').forEach((el, i) => {
      el.classList.toggle('hover', i === slashHover);
    });
  }
  function hideSlashMenu() {
    const m = document.getElementById('slash_menu');
    if (m) m.remove();
  }
  function applySlash(it) {
    if (it.cmd === '/clear') { hideSlashMenu(); input.value = ''; input.dispatchEvent(new Event('input')); newChat(); return; }
    if (it.cmd === '/export') { hideSlashMenu(); input.value = ''; input.dispatchEvent(new Event('input')); if (activeChatObj) exportChatMd(activeChatObj); else toast({ title: 'Nothing to export yet.' }, 2500); return; }
    input.value = it.cmd + ' ';
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    hideSlashMenu();
    input.dispatchEvent(new Event('input'));
  }

  // input
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    sendBtn.disabled = !input.value.trim() || busy;
    const v = input.value;
    if (v.startsWith('/')) {
      const firstWord = v.split(' ')[0];
      if (!v.includes(' ')) showSlashMenu(firstWord);
      else hideSlashMenu();
    } else hideSlashMenu();
  });

  input.addEventListener('keydown', (e) => {
    const menu = document.getElementById('slash_menu');
    if (menu) {
      const n = (menu._items || []).length;
      if (e.key === 'ArrowDown') { e.preventDefault(); slashHover = (slashHover + 1) % n; refreshSlashHover(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); slashHover = (slashHover - 1 + n) % n; refreshSlashHover(); return; }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); applySlash(menu._items[slashHover]); return; }
      if (e.key === 'Escape') { hideSlashMenu(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
    if (e.key === 'Escape' && busy) {
      e.preventDefault();
      stopGeneration();
    }
  });

  sendBtn.addEventListener('click', () => {
    if (busy) stopGeneration();
    else submit();
  });

  document.querySelectorAll('.chip').forEach(btn => {

  function stopGeneration() {
    if (currentAbort) {
      try { currentAbort.abort(); } catch(e) {}
      currentAbort = null;
    }
  }

  function buildPrompt() {
    const sys = [];
    if (state.model === 'chadcoder') sys.push(CHADCODER_SYSTEM_PROMPT);
    else if (state.settings.chadMode) sys.push(CHAD_SYSTEM_PROMPT);
    if (state.systemPrompt) sys.push(state.systemPrompt);
    if (state.customInstructions.about) sys.push(`About the user: ${state.customInstructions.about}`);
    if (state.customInstructions.style) sys.push(`Response style: ${state.customInstructions.style}`);
    const sysBlock = sys.length ? sys.join('\n\n') : null;
    const msgs = history.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));
    if (sysBlock && msgs.length && msgs[0].role === 'user') {
      msgs[0] = { role: 'user', content: sysBlock + '\n\n---\n\n' + msgs[0].content };
    }
    return msgs;
  }

  async function runTurn(userText) {
    busy = true;
    setSendMode('stop');
    ensureChat(userText);

    const userIdx = history.length;
    history.push({ role: 'user', content: userText });
    if (activeChatObj) {
      activeChatObj.messages = history.slice();
      saveState();
    }
    addUserMsgEl(userText, userIdx);

    const botRow = document.createElement('div');
    botRow.className = 'msg_row bot';
    botRow.innerHTML = `<div class="bot_body"></div>`;
    const botBody = botRow.querySelector('.bot_body');
    botBody.innerHTML = '<span class="stream_cursor"></span>';
    const metaRow = document.createElement('div');
    metaRow.className = 'stream_meta';
    metaRow.innerHTML = `<span class="tok" id="tps">0 tok/s</span><span>· edge ${edgeCity.code} · ${edgePing}ms RTT</span>`;
    botRow.appendChild(metaRow);
    inner.appendChild(botRow);
    scrollDown();

    const tpsEl = metaRow.querySelector('#tps');
    const started = Date.now();
    let streamed = '';
    currentAbort = new AbortController();

    const updateTps = () => {
      const elapsed = (Date.now() - started) / 1000;
      if (elapsed > 0) {
        const tokens = Math.round(streamed.length / 4);
        const rate = Math.round(tokens / elapsed);
        tpsEl.textContent = rate + ' tok/s';
      }
    };
    const tpsInterval = setInterval(updateTps, 200);

    let result = null;
    let errorText = null;

    if (!claudeSample) {
      errorText = "Edge inference is offline. The sample capability was not granted.";
    } else {
      try {
        result = await claudeSample(buildPrompt(), {
          modelTier: state.model === 'o1' || state.model === 'gpt4' ? 'default' : 'quick',
          signal: currentAbort.signal,
          onText: ({ text }) => {
            streamed = text;
            const withCursor = renderMd(text) + '<span class="stream_cursor"></span>';
            botBody.innerHTML = withCursor;
            scrollDown();
          },
        });
      } catch (e) {
        if (e && e.code === 'aborted') {
          errorText = null;
          result = { text: streamed + ' [stopped]' };
        } else {
          errorText = (e && (e.message || e.text)) || 'Edge returned an error.';
        }
      }
    }

    clearInterval(tpsInterval);
    updateTps();
    currentAbort = null;

    const finalText = errorText || (result && result.text) || streamed || '(no response)';
    botBody.innerHTML = renderMd(finalText);
    const took = ((Date.now() - started) / 1000).toFixed(2);
    metaRow.innerHTML = `<span class="tok">${Math.round((finalText.length/4) / ((Date.now()-started)/1000 || 1))} tok/s</span><span>· ${took}s · ${edgeCity.code} · ${edgePing}ms</span>`;

    const actions = document.createElement('div');
    actions.className = 'msg_actions show';
    actions.innerHTML = `
      <button class="action_btn" data-act="copy" aria-label="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      <button class="action_btn" data-act="like" aria-label="like"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H7"/></svg></button>
      <button class="action_btn" data-act="dislike" aria-label="dislike"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H17"/></svg></button>
      <button class="action_btn" data-act="regen" aria-label="regenerate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg></button>
      <button class="action_btn" data-act="speak" aria-label="read aloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
      <span class="action_stat">${Math.round(finalText.length/4)} tok</span>
    `;
    botRow.appendChild(actions);

    actions.querySelector('[data-act="copy"]').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(finalText); toast({ title: 'Copied.' }, 2000, 'ok'); } catch(e){}
    });
    actions.querySelector('[data-act="like"]').addEventListener('click', (e) => e.currentTarget.classList.toggle('active'));
    actions.querySelector('[data-act="dislike"]').addEventListener('click', (e) => {
      e.currentTarget.classList.toggle('active');
      toast({ title: 'Thanks for the feedback.' }, 2000);
    });
    actions.querySelector('[data-act="regen"]').addEventListener('click', () => {
      if (busy) return;
      // drop last assistant from history, re-run on last user text
      const last = history[history.length - 1];
      if (last?.role === 'assistant') history.pop();
      if (activeChatObj) activeChatObj.messages = history.slice();
      botRow.remove();
      const lastUser = history[history.length - 1];
      if (lastUser?.role === 'user') {
        history.pop();
        if (activeChatObj) activeChatObj.messages = history.slice();
        renderConversation();
        runTurn(lastUser.content);
      }
    });
    actions.querySelector('[data-act="speak"]').addEventListener('click', () => {
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(finalText);
        u.rate = 1.1;
        window.speechSynthesis.speak(u);
      } catch(e){}
    });

    history.push({ role: 'assistant', content: finalText });
    if (activeChatObj) {
      activeChatObj.messages = history.slice();
      saveState();
      // auto-title new chat after first exchange
      if (history.length === 2 && activeChatObj.title.length < 42) {
        const t = userText.slice(0, 38) + (userText.length > 38 ? '…' : '');
        activeChatObj.title = t;
        saveState();
        renderChatList();
      }
    }

    busy = false;
    setSendMode('send');
    input.focus();
  }

  input.focus();
</script>
