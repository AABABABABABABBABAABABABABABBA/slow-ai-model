<title>ChadGPT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* layout: centered column, sticky header, sticky composer. visual language mirrors chatgpt. */
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --sidebar: #f9f9f9;
    --user_bubble: #f4f4f4;
    --fg: #0d0d0d;
    --muted: #676767;
    --faint: #e5e5e5;
    --border: #e5e5e5;
    --accent: #000000;
    --accent_fg: #ffffff;
    --danger: #d14343;
    --warn_bg: #fdf3d6;
    --warn_fg: #7a5c0a;
    --warn_border: #f0d875;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #212121;
      --surface: #2f2f2f;
      --sidebar: #171717;
      --user_bubble: #323232;
      --fg: #ececec;
      --muted: #b4b4b4;
      --faint: #4e4e4e;
      --border: #4e4e4e;
      --accent: #ffffff;
      --accent_fg: #0d0d0d;
      --danger: #ff6b6b;
      --warn_bg: #3d2f0d;
      --warn_fg: #f0d875;
      --warn_border: #7a5c0a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #212121;
    --surface: #2f2f2f;
    --sidebar: #171717;
    --user_bubble: #323232;
    --fg: #ececec;
    --muted: #b4b4b4;
    --faint: #4e4e4e;
    --border: #4e4e4e;
    --accent: #ffffff;
    --accent_fg: #0d0d0d;
    --danger: #ff6b6b;
    --warn_bg: #3d2f0d;
    --warn_fg: #f0d875;
    --warn_border: #7a5c0a;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 20;
  }

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    border-bottom: 1px solid transparent;
  }
  .model_picker {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 8px 10px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 18px;
    cursor: default;
    user-select: none;
  }
  .model_picker:hover { background: var(--user_bubble); }
  .model_picker .chev {
    color: var(--muted);
    font-size: 14px;
    margin-left: 2px;
  }
  .model_picker .sub {
    color: var(--muted);
    font-weight: 500;
    font-size: 14px;
    margin-left: 2px;
  }
  .header_right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .icon_btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--fg);
    border: none;
    cursor: pointer;
  }
  .icon_btn:hover { background: var(--user_bubble); }
  .icon_btn svg { width: 20px; height: 20px; }
  .avatar_btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #19c37d;
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    user-select: none;
  }

  .banner {
    background: var(--warn_bg);
    color: var(--warn_fg);
    border-top: 1px solid var(--warn_border);
    border-bottom: 1px solid var(--warn_border);
    font-size: 13px;
    padding-block: 8px;
  }
  .banner_inner {
    max-width: 768px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .banner .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--warn_fg);
    flex-shrink: 0;
  }

  main {
    flex: 1;
    overflow-y: auto;
    min-width: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .inner {
    max-width: 768px;
    margin: 0 auto;
    padding-block: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    min-width: 0;
  }

  .welcome {
    text-align: center;
    padding: 60px 0 20px;
  }
  .welcome h1 {
    font-size: 30px;
    font-weight: 600;
    margin: 0 0 10px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .welcome p {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
  }
  .suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 40px;
    max-width: 640px;
    margin-inline: auto;
    width: 100%;
  }
  .suggestion {
    text-align: left;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.4;
  }
  .suggestion:hover { background: var(--user_bubble); }
  .suggestion b {
    display: block;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .suggestion span {
    color: var(--muted);
  }
  @media (max-width: 500px) {
    .suggestions { grid-template-columns: 1fr; }
    .welcome { padding-top: 30px; }
    .welcome h1 { font-size: 24px; }
  }

  .msg_row {
    display: flex;
    gap: 12px;
    min-width: 0;
  }
  .msg_row.user {
    justify-content: flex-end;
  }
  .msg_row.user .bubble {
    background: var(--user_bubble);
    padding: 10px 16px;
    border-radius: 22px;
    max-width: 80%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg_row.bot {
    align-items: flex-start;
  }
  .bot_avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--fg);
    color: var(--bg);
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .bot_avatar svg { width: 16px; height: 16px; }
  .bot_body {
    flex: 1;
    min-width: 0;
    white-space: pre-wrap;
    word-wrap: break-word;
    padding-top: 2px;
  }
  .bot_body p { margin: 0 0 10px; }
  .bot_body p:last-child { margin-bottom: 0; }

  .thinking_dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    height: 24px;
  }
  .thinking_dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: dots 1.4s ease-in-out infinite;
  }
  .thinking_dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking_dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dots {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  .inline_status {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    margin-top: 4px;
  }

  .typing_cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--fg);
    vertical-align: text-bottom;
    margin-left: 1px;
    animation: blink 1s steps(2) infinite;
    border-radius: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .toast_wrap {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 72px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: calc(100% - 32px);
    max-width: 440px;
    pointer-events: none;
  }
  .toast {
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--danger);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.4;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    opacity: 0;
    transform: translateY(-10px);
    animation: toast_in 0.25s ease-out forwards;
    pointer-events: auto;
  }
  .toast.out {
    animation: toast_out 0.25s ease-in forwards;
  }
  @keyframes toast_in {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes toast_out {
    to { opacity: 0; transform: translateY(-10px); }
  }
  .toast .tdot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
    margin-top: 5px;
  }
  .toast .tx { flex: 1; min-width: 0; }
  .toast .tx b { display: block; font-weight: 600; margin-bottom: 2px; font-size: 14px; }
  .toast .tx span { color: var(--muted); font-size: 13px; }

  footer {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .composer_wrap {
    max-width: 768px;
    margin: 0 auto;
  }
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--user_bubble);
    border-radius: 28px;
    padding: 10px 10px 10px 18px;
    border: 1px solid transparent;
  }
  .composer:focus-within { border-color: var(--border); }
  .composer textarea {
    flex: 1;
    min-width: 0;
    background: transparent;
    color: var(--fg);
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    padding: 6px 0;
    max-height: 160px;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .send_btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent_fg);
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send_btn:disabled {
    background: var(--faint);
    color: var(--muted);
    cursor: not-allowed;
  }
  .send_btn svg { width: 18px; height: 18px; }
  .footnote {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
  }
</style>

<header>
  <div class="model_picker">
    ChadGPT <span class="sub">4o</span><span class="chev">▾</span>
  </div>
  <div class="header_right">
    <button class="icon_btn" aria-label="new chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <div class="avatar_btn">C</div>
  </div>
</header>

<div class="banner" id="banner" hidden>
  <div class="banner_inner">
    <span class="dot"></span>
    <span id="banner_text">Elevated response times. Our engineers are investigating.</span>
  </div>
</div>

<div class="toast_wrap" id="toasts"></div>

<main id="main">
  <div class="inner" id="inner">
    <div class="welcome" id="welcome">
      <h1>What can I overthink for you today?</h1>
      <p>You might want to grab a coffee first.</p>
      <div class="suggestions">
        <button class="suggestion" data-seed="Explain quantum entanglement like I'm five">
          <b>Explain quantum entanglement</b>
          <span>like I'm five</span>
        </button>
        <button class="suggestion" data-seed="Write a haiku about debugging at 3am">
          <b>Write a haiku</b>
          <span>about debugging at 3am</span>
        </button>
        <button class="suggestion" data-seed="What's a good one line linux command to find the biggest files on my disk">
          <b>Find big files</b>
          <span>a one-line linux command</span>
        </button>
        <button class="suggestion" data-seed="Give me a creative username based on the words moss and radio">
          <b>Creative username</b>
          <span>from moss and radio</span>
        </button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="composer_wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message ChadGPT" autocomplete="off"></textarea>
      <button class="send_btn" id="send" disabled aria-label="send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
    <div class="footnote">ChadGPT can make mistakes. It can also take a nap mid-sentence.</div>
  </div>
</footer>

<script>
  const inner = document.getElementById('inner');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const welcome = document.getElementById('welcome');
  const banner = document.getElementById('banner');
  const bannerText = document.getElementById('banner_text');
  const toastWrap = document.getElementById('toasts');

  const history = [];
  let busy = false;
  let claudeSample = null;

  (async () => {
    const s = await window.claude?.use?.('sample');
    claudeSample = s;
  })();

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    sendBtn.disabled = !input.value.trim() || busy;
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  sendBtn.addEventListener('click', submit);

  document.querySelectorAll('.suggestion').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.getAttribute('data-seed');
      input.value = text;
      input.dispatchEvent(new Event('input'));
      submit();
    });
  });

  function submit() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    if (welcome && welcome.parentNode) welcome.remove();
    runTurn(text);
  }

  function addUserMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg_row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    inner.appendChild(row);
    scrollDown();
    return row;
  }

  function addBotRow() {
    const row = document.createElement('div');
    row.className = 'msg_row bot';
    row.innerHTML = `
      <div class="bot_avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4Z"/>
          <path d="M5 20a7 7 0 0 1 14 0"/>
        </svg>
      </div>
      <div class="bot_body"></div>
    `;
    inner.appendChild(row);
    scrollDown();
    return row;
  }

  function showBanner(text) {
    bannerText.textContent = text;
    banner.hidden = false;
  }
  function hideBanner() {
    banner.hidden = true;
  }

  const toastContent = [
    { title: 'Hmm... something seems to have gone wrong.', body: 'There was an error generating a response. Please try again.' },
    { title: 'You\'ve reached our usage limit.', body: 'Your quota resets at an unspecified later time.' },
    { title: 'Rate limit exceeded', body: 'Too many requests. The model is on a smoke break.' },
    { title: 'Network error', body: 'The server took too long to respond. Check your connection, our mood, or the stars.' },
    { title: 'Our systems are experiencing high demand.', body: 'Please remain in your seat with your tray table in the upright position.' },
    { title: 'The server had an error while processing your request.', body: 'Sorry about that!' },
    { title: 'Capacity constraints', body: 'Available again when the GPUs stop crying.' },
    { title: 'Something went wrong', body: 'If this issue persists please contact us through our help center at help.imadeitup.com.' },
  ];

  function toast(obj, duration = 4500) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `
      <div class="tdot"></div>
      <div class="tx"><b></b><span></span></div>
    `;
    el.querySelector('b').textContent = obj.title;
    el.querySelector('span').textContent = obj.body;
    toastWrap.appendChild(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 300);
    }, duration);
  }

  function scrollDown() {
    requestAnimationFrame(() => {
      const main = document.getElementById('main');
      main.scrollTo({ top: main.scrollHeight, behavior: 'smooth' });
    });
  }

  const statusLines = [
    'Thinking...',
    'Still thinking...',
    'Reconnecting to the model...',
    'Reasoning deeply...',
    'Loading response...',
    'Just a moment...',
    'This is taking longer than usual...',
    'Rerouting through backup region...',
    'Thinking some more...',
    'Almost there...',
  ];

  async function runTurn(userText) {
    busy = true;
    sendBtn.disabled = true;

    addUserMsg(userText);
    history.push({ role: 'user', content: userText });

    const botRow = addBotRow();
    const botBody = botRow.querySelector('.bot_body');

    // thinking dots + inline status
    botBody.innerHTML = `
      <div class="thinking_dots"><span></span><span></span><span></span></div>
      <div class="inline_status" id="inline_status"></div>
    `;
    const inlineStatus = botRow.querySelector('#inline_status');

    showBanner('Elevated response times. Our engineers are investigating.');

    // real ai call fires immediately
    let aiPromise;
    if (claudeSample) {
      const prompt = history.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));
      aiPromise = claudeSample(prompt, { modelTier: 'quick' }).catch(err => ({ error: err }));
    } else {
      aiPromise = Promise.resolve({ text: "The AI call needs the sample capability granted. The UI is fine, you just can't talk to a model." });
    }

    // cycle statuses and pop toasts
    const started = Date.now();
    let aiDone = false;
    let aiResult = null;
    aiPromise.then(r => { aiResult = r; aiDone = true; });

    let statusIdx = 0;
    const statusTick = setInterval(() => {
      inlineStatus.textContent = statusLines[statusIdx % statusLines.length];
      statusIdx++;
    }, 3500);
    inlineStatus.textContent = statusLines[0];
    statusIdx = 1;

    // toasts pop every ~6-9s
    let toastIdx = Math.floor(Math.random() * toastContent.length);
    const toastTick = setInterval(() => {
      toast(toastContent[toastIdx % toastContent.length]);
      toastIdx++;
    }, 7000);
    // first toast after a short delay
    setTimeout(() => toast(toastContent[toastIdx++ % toastContent.length]), 2200);

    // enforce minimum stall
    const minStallMs = 24000;
    while (Date.now() - started < minStallMs || !aiDone) {
      await sleep(500);
    }

    clearInterval(statusTick);
    clearInterval(toastTick);

    inlineStatus.textContent = 'Starting response...';
    await sleep(900);

    hideBanner();

    // clear thinking state, prepare for stream
    botBody.innerHTML = '';
    const textNode = document.createElement('span');
    const cursor = document.createElement('span');
    cursor.className = 'typing_cursor';
    botBody.appendChild(textNode);
    botBody.appendChild(cursor);

    const result = aiResult || {};
    let text = '';
    if (result.error) {
      text = "Our model experienced an unrecoverable error. Please try again in approximately never.";
    } else {
      text = result.text || "The model responded with silence. Make of that what you will.";
    }

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      textNode.appendChild(document.createTextNode(ch));
      scrollDown();
      let d = 28;
      if (ch === ' ') d = 55;
      if (ch === '.' || ch === '!' || ch === '?') d = 380;
      if (ch === ',' || ch === ';' || ch === ':') d = 180;
      if (ch === '\n') d = 220;
      await sleep(d);
    }
    cursor.remove();

    history.push({ role: 'assistant', content: text });

    busy = false;
    sendBtn.disabled = !input.value.trim();
    input.focus();
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  input.focus();
</script>
