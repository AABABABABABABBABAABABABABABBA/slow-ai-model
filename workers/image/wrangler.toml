name = "chadgpt-image"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[ai]
binding = "AI"

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "http://localhost:8788"

# Required secret (SAME value across all 3 workers):
#   npx wrangler secret put SESSION_SECRET
# Same SESSIONS KV namespace as chat + code workers:
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "paste-id-here"
