name = "chadcode-license"
main = "src/index.js"
compatibility_date = "2024-12-01"

# D1 binding: `wrangler d1 create chadcode-license` and paste the id below.
[[d1_databases]]
binding = "LIC_DB"
database_name = "chadcode-license"
database_id = "aa6f6d71-91b3-4820-8c7c-539209804d53"

# KV for channel config + feature flags.
[[kv_namespaces]]
binding = "LIC_KV"
id = "f91061afca3247d0aa94c4fd71ea6c1b"

# R2 bucket holding the compiled chadcode binaries.
# Create once:  npx wrangler r2 bucket create chadcode-binaries
# Upload (per platform):
#   npx wrangler r2 object put chadcode-binaries/chadcode/darwin-arm64/chadcode \
#     --file packages/cli/dist/cli-darwin-arm64/bin/chadcode --remote
[[r2_buckets]]
binding = "BINARIES"
bucket_name = "chadcode-binaries"

# Secrets to set via `wrangler secret put`:
#   FOUNDER_TOKEN  — bearer for /license/revoke + /update/publish + /license/create + /license/list
#   TOKEN_SECRET   — HMAC secret used to sign offline verification tokens
#
# The update signing keypair (ed25519) is stored OFFLINE on the founder's
# machine — only the public key ships in the client. The worker stores the
# signature at publish time; it never sees the private key.
