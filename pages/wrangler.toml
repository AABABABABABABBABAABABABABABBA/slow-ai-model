name = "chadgpt"
compatibility_date = "2025-10-01"
pages_build_output_dir = "."

# Non-secret vars — the worker URLs the Pages Functions proxy to.
[vars]
CHAT_URL = "https://chadgpt-chat.corbyiscool.workers.dev"
CODE_URL = "https://chadgpt-code.corbyiscool.workers.dev"
IMAGE_URL = "https://chadgpt-image.corbyiscool.workers.dev"
LICENSE_WORKER_URL = "https://chadcode-license.corbyiscool.workers.dev"
PAGES_ORIGIN = "https://chadgpt-964.pages.dev"
HCAPTCHA_SITEKEY = "b2d6190e-9682-4a20-9342-b306da86c234"

# Secrets (set via `wrangler pages secret put <NAME> --project-name chadgpt`):
#   JWT_SECRET            — signs user session cookies (HS256)
#   WORKER_SESSION_SECRET — same value as SESSION_SECRET in the workers,
#                           so Pages Functions can mint tokens the workers trust

[[d1_databases]]
binding = "DB"
database_name = "chadgpt-users"
database_id = "e0166cbb-1e40-45b1-986b-b865321506df"

# Shared with the workers. Used by Pages Functions for the per-user
# concurrency limiter (conc:<user_id> keys) and could be used for Pages-
# side rate buckets later.
[[kv_namespaces]]
binding = "SESSIONS"
id = "1b4345bdcf7248bd89be72d520af37f5"
